name: CraftUI Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Run Specification & Domain Rule Tests
      run: npm test

    - name: Run CraftUI Scanner on Built-in Snippets
      run: node bin/craftui.js scan snippets/
